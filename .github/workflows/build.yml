name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译（自包含单文件）
        run: >
          dotnet publish windows/MiTVSwitch.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: MiTVSwitch-win-x64
          path: out/MiTVSwitch.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: |
          cd macos
          chmod +x build.sh
          ./build.sh

      - name: 打包
        run: |
          cd macos
          # build.sh 产物在 out.noindex/（.noindex 目录 Spotlight 不索引，避免启动台双图标）
          ditto -c -k --sequesterRsrc --keepParent out.noindex/MiTVSwitch.app MiTVSwitch-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MiTVSwitch-macos
          path: macos/MiTVSwitch-macos.zip
          if-no-files-found: error

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 重命名产物
        run: |
          mkdir -p files
          cp dist/MiTVSwitch-win-x64/MiTVSwitch.exe files/MiTVSwitch-win-x64.exe
          cp dist/MiTVSwitch-macos/MiTVSwitch-macos.zip files/

      # 如果这个 tag 已经有 Release 了（比如手动发过），就跳过，
      # 避免同名产物重复上传导致 422 报错。
      - name: 检查是否已存在同名 Release
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ github.ref_name }} 已存在，跳过发布步骤。"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 不设 generate_release_notes：这样 Release 正文取的是 annotated tag 的说明文字，
      # 打 tag 时写清楚发版内容即可，不用再单独维护一份。
      - uses: softprops/action-gh-release@v2
        if: steps.exists.outputs.found == 'false'
        with:
          files: files/*
